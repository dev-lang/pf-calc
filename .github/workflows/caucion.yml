name: Actualizar cauciones

on:
  schedule:
    # Lunes a viernes 21:17 UTC = 18:17 Argentina (después del cierre del mercado)
    - cron: '17 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cauciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Descargar CSVs de Rava y fusionar en data/cauciones/
        run: node scripts/update-caucion.mjs

      - name: Quitar el archivo del formato anterior (ya migrado a data/cauciones/1d.json)
        run: |
          if [ -f data/caucion-1d.json ] && [ -f data/cauciones/1d.json ]; then
            git rm -q data/caucion-1d.json
          fi

      - name: Commitear si hubo cambios
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "data: cauciones al $(node -p "require('./data/cauciones/index.json').actualizado")"
          # Reintenta por si otro workflow pusheó justo antes
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
